# certhaven: admin UI over HTTPS, CRLs and CA certificates also over plain HTTP
# (clients fetch CDP/AIA URLs without TLS).

upstream certhaven {
    server 127.0.0.1:8000;
}

# Slow down password guessing before it reaches the app (10 requests/minute per IP).
limit_req_zone $binary_remote_addr zone=certhaven_login:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ~ ^/(crl|ca)/ {
        proxy_pass http://certhaven;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/certhaven/tls/server.crt;
    ssl_certificate_key /etc/certhaven/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:certhaven:1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    # Optional: restrict the admin UI to your management network.
    # location / { allow 10.0.0.0/8; deny all; ... }

    # Every page that checks a password: log in, unlock the keys, change your password.
    location ~ ^/(login|unlock|account/password)$ {
        limit_req zone=certhaven_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://certhaven;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restoring a database backup may upload more than the 2 MB allowed elsewhere.
    location = /settings/restore {
        client_max_body_size 64m;
        proxy_pass http://certhaven;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://certhaven;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
